apiVersion: apps/v1
kind: Deployment

metadata:
  name: foodkart-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: foodkart-backend

  template:
    metadata:
      labels:
        app: foodkart-backend

    spec:
      containers:
        - name: backend
          image: foodkart-backend:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          resources:
             requests:
               cpu: "100m"
               memory: "128Mi"

             limits:
               cpu: "500m"
               memory: "512Mi"  

          env:
            - name: APP_VERSION
              value: "v2"
              
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: foodkart-postgres-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: foodkart-postgres-config
                  key: DB_PORT

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: foodkart-postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodkart-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: foodkart-postgres-secret
                  key: POSTGRES_DB

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20